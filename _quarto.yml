project:
  type: website
  output-dir: docs
  pre-render: node scripts/build-data.mjs
  render:
    - index.qmd
    - jornal.qmd
  resources:
    - "o-chamado-newsletters/**"
    - ".nojekyll"

website:
  title: "O Chamado"
  site-url: "https://bhereth.github.io/o-chamado/"
  page-navigation: false
  navbar:
    background: primary
    left:
      - href: index.qmd#missao
        text: A Missão
      - href: index.qmd#areas
        text: As Áreas
      - href: index.qmd#missionarios
        text: Os Missionários
      - href: index.qmd#reencontros
        text: Os Reencontros
      - href: index.qmd#woodwards
        text: Os Woodwards
      - href: jornal.qmd
        text: O Jornal
  page-footer:
    background: dark
    center: |
      O Chamado da Missão Brasil Porto Alegre Norte · 1997–2000<br>
      *The Call of the Brazil Porto Alegre North Mission*<br>
      Edições do jornal que faltam, fotos, correções ou comentários: [info@ochamado.net](mailto:info@ochamado.net)

format:
  html:
    theme: [litera, theme.scss]
    lang: pt-BR
    toc: false
    page-layout: full
    anchor-sections: false
    smooth-scroll: true
    include-in-header:
      - text: |
          <link rel="preconnect" href="https://fonts.googleapis.com">
          <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
          <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,400&family=Inter:wght@400;500;600;700&display=swap">

execute:
  echo: false
