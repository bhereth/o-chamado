project:
  type: website
  output-dir: docs
  pre-render: node scripts/build-data.mjs
  render:
    - index.qmd
  resources:
    - "o-chamado-newsletters/**"
    - ".nojekyll"
    - "CNAME"
    - "images/globo-*.svg"
    - "images/mapa-rs-*.svg"

website:
  title: "O Chamado — Missão Porto Alegre Norte com os Woodward (1997–2000)"
  site-url: "https://ochamado.org/"
  page-navigation: false
  navbar:
    title: "O Chamado"
    background: primary
    pinned: true
    left:
      - href: index.qmd#missao
        text: Missão
      - href: index.qmd#areas
        text: Áreas
      - href: index.qmd#missionarios
        text: Missionários
      - href: index.qmd#templo
        text: Templo
      - href: index.qmd#jornal
        text: Jornais
      - href: index.qmd#reencontros
        text: Reencontros
      - href: index.qmd#woodwards
        text: Os Woodward
      - href: index.qmd#contato
        text: Contato
  page-footer:
    background: dark
    center: |
      O Chamado da Missão Brasil Porto Alegre Norte <span style="white-space: nowrap">· 1997–2000</span>

format:
  html:
    theme: [litera, theme.scss]
    lang: pt-BR
    toc: false
    page-layout: full
    anchor-sections: false
    smooth-scroll: true
    include-in-header:
      - text: |
          <script>
          // Pick the language before the page paints: a saved choice wins, otherwise the browser's language.
          (function () {
            var l = null;
            try { l = localStorage.getItem("ochamado-lang"); } catch (e) {}
            if (l !== "pt" && l !== "en") {
              var n = (navigator.languages && navigator.languages[0]) || navigator.language || "pt";
              l = /^en/i.test(n) ? "en" : "pt";
            }
            document.documentElement.setAttribute("data-lang", l);
            document.documentElement.lang = l === "en" ? "en" : "pt-BR";
          })();
          </script>
          <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
          <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
          <link rel="preconnect" href="https://fonts.googleapis.com">
          <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
          <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,400&family=Inter:wght@400;500;600;700&display=swap">

    include-after-body:
      - text: |
          <script>
          (function () {
            function navH() {
              var h = document.getElementById("quarto-header");
              if (h) document.documentElement.style.setProperty("--nav-h", h.offsetHeight + "px");
            }
            navH();
            addEventListener("resize", navH);
            addEventListener("load", navH);
          })();

          (function () {
            var root = document.documentElement;
            var NAV = {
              missao: ["Missão", "Mission"], areas: ["Áreas", "Areas"], missionarios: ["Missionários", "Missionaries"],
              templo: ["Templo", "Temple"], jornal: ["Jornais", "Newsletters"], reencontros: ["Reencontros", "Reunions"],
              woodwards: ["Os Woodward", "Woodwards"], contato: ["Contato", "Contact"]
            };
            var tools = document.querySelector(".quarto-navbar-tools") || document.querySelector(".navbar-container");
            var box = document.createElement("div");
            box.className = "nav-idioma";
            box.setAttribute("role", "group");
            box.setAttribute("aria-label", "Idioma / Language");
            box.innerHTML = '<button type="button" data-lang="pt" lang="pt">PT</button><button type="button" data-lang="en" lang="en">EN</button>';
            if (tools) tools.prepend(box);

            function apply(lang) {
              root.setAttribute("data-lang", lang);
              root.lang = lang === "en" ? "en" : "pt-BR";
              box.querySelectorAll("button").forEach(function (b) {
                var on = b.getAttribute("data-lang") === lang;
                b.classList.toggle("active", on);
                b.setAttribute("aria-pressed", on ? "true" : "false");
              });
              document.querySelectorAll(".navbar .nav-link").forEach(function (a) {
                var key = (a.getAttribute("href") || "").split("#")[1];
                var label = a.querySelector(".menu-text");
                if (NAV[key] && label) label.textContent = NAV[key][lang === "en" ? 1 : 0];
              });
              document.querySelectorAll("[data-placeholder-" + lang + "]").forEach(function (el) {
                el.placeholder = el.getAttribute("data-placeholder-" + lang);
              });
              window.dispatchEvent(new Event("ochamado:idioma"));
            }
            box.addEventListener("click", function (e) {
              var b = e.target.closest("button");
              if (!b) return;
              var lang = b.getAttribute("data-lang");
              try { localStorage.setItem("ochamado-lang", lang); } catch (err) {}
              apply(lang);
            });
            apply(root.getAttribute("data-lang") === "en" ? "en" : "pt");
            // The search box is created later by Observable; fill its placeholder once it exists.
            addEventListener("load", function () { setTimeout(function () { apply(root.getAttribute("data-lang")); }, 1500); });

            // On small screens, close the hamburger menu once a section is picked, and only then scroll:
            // while the menu is open the page's top padding is the tall open header, so scrolling right away
            // lands far below the section once the menu closes.
            document.addEventListener("click", function (e) {
              var link = e.target.closest(".navbar-collapse .nav-link");
              var menu = document.querySelector(".navbar-collapse.show");
              if (!link || !menu || !window.bootstrap) return;
              var collapse = bootstrap.Collapse.getOrCreateInstance(menu, { toggle: false });
              var id = (link.getAttribute("href") || "").split("#")[1];
              var alvo = id && document.getElementById(id);
              if (!alvo) { collapse.hide(); return; }
              e.preventDefault();
              menu.addEventListener("hidden.bs.collapse", function () {
                var h = document.getElementById("quarto-header");
                if (h) document.documentElement.style.setProperty("--nav-h", h.offsetHeight + "px");
                requestAnimationFrame(function () {
                  alvo.scrollIntoView({ behavior: "smooth", block: "start" });
                  history.pushState(null, "", "#" + id);
                });
              }, { once: true });
              collapse.hide();
            });
          })();
          </script>

execute:
  echo: false
