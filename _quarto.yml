project:
  type: website
  output-dir: docs
  pre-render: node scripts/build-data.mjs
  render:
    - index.qmd
  resources:
    - "o-chamado-newsletters/**"
    - ".nojekyll"

website:
  title: "O Chamado"
  site-url: "https://bhereth.github.io/o-chamado/"
  page-navigation: false
  navbar:
    background: primary
    left:
      - href: index.qmd#missao
        text: Missão
      - href: index.qmd#areas
        text: Áreas
      - href: index.qmd#missionarios
        text: Missionários
      - href: index.qmd#jornal
        text: Jornal
      - href: index.qmd#reencontros
        text: Reencontros
      - href: index.qmd#woodwards
        text: Woodwards
      - href: index.qmd#contato
        text: Contato
  page-footer:
    background: dark
    center: |
      O Chamado da Missão Brasil Porto Alegre Norte · 1997–2000<br>
      *The Call of the Brazil Porto Alegre North Mission*

format:
  html:
    theme: [litera, theme.scss]
    lang: pt-BR
    toc: false
    page-layout: full
    anchor-sections: false
    smooth-scroll: true
    include-in-header:
      - text: |
          <link rel="preconnect" href="https://fonts.googleapis.com">
          <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
          <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,400&family=Inter:wght@400;500;600;700&display=swap">

execute:
  echo: false
